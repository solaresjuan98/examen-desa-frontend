<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Simulado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-bubble {
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            max-width: 75%;
        }

        .chat-user {
            background-color: #d1e7dd;
            align-self: flex-end;
        }

        .chat-bot {
            background-color: #f8d7da;
            align-self: flex-start;
        }

        .chat-window {
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 15px;
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>

    <div class="container-fluid mt-3">
        <div class="row">
            <!-- Lista de Chats -->
            <div class="col-md-3 border-end">
                <h5>Mis Chats</h5>
                <ul class="list-group" id="chatList">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chat 1
                        <button class="btn btn-sm btn-danger">🗑️</button>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chat 2
                        <button class="btn btn-sm btn-danger">🗑️</button>
                    </li>
                    <!-- Puedes agregar dinámicamente más aquí -->
                </ul>
            </div>

            <!-- Ventana Principal del Chat -->
            <div class="col-md-9 d-flex flex-column">
                <div class="chat-window mb-3 border rounded" id="chatWindow">
                    <div class="chat-bubble chat-user align-self-end">Hola, ¿cómo estás?</div>
                    <div class="chat-bubble chat-bot align-self-start">¡Hola! Estoy bien, ¿en qué te ayudo?</div>
                </div>

                <!-- Formulario de Entrada -->
                <form class="d-flex gap-2" enctype="multipart/form-data">
                    <input type="text" class="form-control" placeholder="Escribe un mensaje..." />
                    <input type="file" class="form-control form-control-sm" accept="image/*,.pdf">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
